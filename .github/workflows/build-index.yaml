name: Build Kannada Games Index

on:
  push:
    branches: [main]
    paths:
      - 'games/*.html'
      - '.github/workflows/build-index.yml'
  pull_request:
    paths:
      - 'games/*.html'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse HTML metadata & validate
        run: |
          python3 - << 'EOF'
          import os, glob, json, sys
          from html.parser import HTMLParser

          ALLOWED_CATEGORIES = {
              "Aksharamale (Alphabet & Script)",
              "Vocabulary & Themes",
              "Reading & Word Building",
              "Listening & Speaking",
              "Grammar & Sentences",
              "Culture, Rhymes & Stories"
          }

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title = ""
                  self.meta = {}

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.in_title = True
                  elif tag.lower() == "meta":
                      attr_dict = {k.lower(): v for k, v in attrs if k}
                      name = attr_dict.get("name", "").strip()
                      content = attr_dict.get("content", "").strip()
                      if name:
                          self.meta[name] = content

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

          games = []
          errors = []

          for filepath in sorted(glob.glob("games/*.html")):
              parser = MetaParser()
              with open(filepath, "r", encoding="utf-8") as f:
                  parser.feed(f.read())

              title = parser.title.strip() or os.path.basename(filepath)
              category = parser.meta.get("game:category", "")
              level = parser.meta.get("game:level") or "Beginner"
              age = [a.strip() for a in parser.meta.get("game:age", "").split(",") if a.strip()]
              tags = [t.strip() for t in parser.meta.get("game:tags", "").split(",") if t.strip()]
              description = parser.meta.get("game:description", "")
              author = parser.meta.get("game:author") or "Community"

              if category not in ALLOWED_CATEGORIES:
                  errors.append(f"{filepath}: Invalid or missing 'game:category' ('{category}'). Allowed: {sorted(ALLOWED_CATEGORIES)}")

              games.append({
                  "title": title,
                  "path": filepath.replace("\\", "/"),
                  "category": category,
                  "level": level,
                  "age": age,
                  "tags": tags,
                  "description": description,
                  "author": author
              })

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          with open("games-index.json", "w", encoding="utf-8") as out:
              json.dump(games, out, ensure_ascii=False, indent=2)
          print(f"Indexed {len(games)} games successfully.")
          EOF

      - name: Commit updated games-index.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games-index.json
          git diff --staged --quiet || git commit -m "chore: update games-index.json"
          git push
