<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ಪ್ರಾಣಿಗಳ ಸಫಾರಿ · Kannada Animal Sound Safari</title>

  <!-- Directory Metadata -->
  <meta name="game:category" content="Listening & Speaking">
  <meta name="game:level" content="Beginner">
  <meta name="game:age" content="4-7">
  <meta name="game:tags" content="Animals, Listening, Speaking, Audio, No-Script">
  <meta name="game:description" content="Listen to Kannada animal names and sound clues to spot the right animal in the jungle and practice saying its name.">
  <meta name="game:author" content="Anand">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Kannada', sans-serif;
      background: linear-gradient(160deg, #fef9c3 0%, #fde047 45%, #bef264 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      color: #365314;
    }
    .topbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
    }
    .home-link {
      text-decoration: none;
      background: white;
      color: #3f6212;
      font-weight: 700;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 0.9rem;
    }
    .score-pill {
      background: #3f6212;
      color: white;
      font-weight: 700;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.92rem;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 680px;
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 14px 35px rgba(63, 98, 18, 0.14);
      text-align: center;
    }
    .progress {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    .clue-box {
      background: #f7fee7;
      border: 3px dashed #84cc16;
      border-radius: 22px;
      padding: 1.2rem;
      margin: 0 auto 1rem;
      max-width: 400px;
      cursor: pointer;
    }
    .sound-bubble {
      font-size: 1.5rem;
      font-weight: 800;
      color: #3f6212;
    }
    .name-reveal {
      font-family: 'Noto Sans Kannada', sans-serif;
      font-size: 1.2rem;
      color: #4d7c0f;
      margin-top: 0.3rem;
    }
    .speak-btn {
      background: #ecfccb;
      border: 2px solid #84cc16;
      color: #365314;
      font-weight: 700;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      margin-bottom: 1rem;
    }
    .safari-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.85rem;
      max-width: 460px;
      margin: 0 auto 1rem;
    }
    .animal-card {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-bottom-width: 5px;
      border-radius: 20px;
      padding: 1rem 0.5rem;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
      font-family: inherit;
    }
    .animal-card:hover:not(:disabled) {
      background: #f7fee7;
      border-color: #84cc16;
      transform: translateY(-2px);
    }
    .animal-card .emoji {
      font-size: 3.6rem;
      display: block;
    }
    .animal-card .sub {
      font-size: 0.88rem;
      font-weight: 700;
      color: #475569;
      margin-top: 0.25rem;
    }
    .animal-card.wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }
    .animal-card.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .repeat-prompt {
      display: none;
      background: #fef3c7;
      border-radius: 14px;
      padding: 0.75rem;
      margin: 0.75rem auto;
      max-width: 420px;
      font-weight: 700;
      color: #92400e;
    }
    .repeat-prompt.visible { display: block; }
    .feedback {
      min-height: 1.6rem;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
    }
    .next-btn {
      display: none;
      background: #4d7c0f;
      color: white;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.75rem 1.8rem;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="home-link" href="../index.html">← All Games</a>
    <div class="score-pill">⭐ Stars: <span id="score">0</span></div>
  </div>

  <div class="card" id="gameCard">
    <div class="progress" id="progressText">Animal 1 of 8</div>

    <div class="clue-box" onclick="playClue()" title="Tap to hear clue">
      <div class="sound-bubble" id="soundClue">"ಬೌ ಬೌ!" · ನಾಯಿ</div>
      <div class="name-reveal" id="phoneticClue">Who says this? (Naayi)</div>
    </div>

    <button class="speak-btn" onclick="playClue()">🔊 ಮತ್ತೆ ಕೇಳಿ (Hear Clue)</button>

    <div class="safari-grid" id="safariGrid"></div>

    <div class="repeat-prompt" id="repeatPrompt">
      🗣️ Now say it aloud: <span id="sayWordText" style="font-size:1.15rem;"></span>!
    </div>

    <div class="feedback" id="feedbackText"></div>
    <button class="next-btn" id="nextBtn" onclick="nextAnimal()">ಮುಂದೆ (Next) ▶</button>
  </div>

<script>
  const ANIMALS = [
    { kn: "ನಾಯಿ", audio: "ani_naayi", phonetic: "Naayi", en: "Dog", soundKn: "ಬೌ ಬೌ", soundEn: "Bow-Bow!", emoji: "🐕" },
    { kn: "ಬೆಕ್ಕು", audio: "ani_bekku", phonetic: "Bekku", en: "Cat", soundKn: "ಮಿಯಾಂವ್", soundEn: "Meow-Meow!", emoji: "🐈" },
    { kn: "ಹಸು", audio: "ani_hasu", phonetic: "Hasu", en: "Cow", soundKn: "ಅಂಬಾ", soundEn: "Moo!", emoji: "🐄" },
    { kn: "ಆನೆ", audio: "ani_aane", phonetic: "Aane", en: "Elephant", soundKn: "ಘೀಳಿಡು", soundEn: "Trumpet!", emoji: "🐘" },
    { kn: "ಕೋತಿ", audio: "ani_kothi", phonetic: "Kothi", en: "Monkey", soundKn: "ಕಿಚ ಕಿಚ", soundEn: "Chatter!", emoji: "🐒" },
    { kn: "ಸಿಂಹ", audio: "ani_simha", phonetic: "Simha", en: "Lion", soundKn: "ಗರ್ಜನೆ", soundEn: "Roar!", emoji: "🦁" },
    { kn: "ಕಪ್ಪೆ", audio: "ani_kappe", phonetic: "Kappe", en: "Frog", soundKn: "ವಟ ವಟ", soundEn: "Ribbit!", emoji: "🐸" },
    { kn: "ಗಿಳಿ", audio: "ani_gili", phonetic: "Gili", en: "Parrot", soundKn: "ಕೀಚು", soundEn: "Squawk!", emoji: "🦜" }
  ];

  let deck = [];
  let idx = 0;
  let score = 0;
  let solved = false;
  let currentAudio = null;
  let bestKannadaVoice = null;

  function loadBestVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    const knVoices = voices.filter(v => v.lang.toLowerCase().includes('kn'));
    bestKannadaVoice =
      knVoices.find(v => /natural|online|google/i.test(v.name)) ||
      knVoices[0] ||
      null;
  }

  if ('speechSynthesis' in window) {
    loadBestVoice();
    window.speechSynthesis.onvoiceschanged = loadBestVoice;
  }

  function speakFallback(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'kn-IN';
    if (bestKannadaVoice) u.voice = bestKannadaVoice;
    u.rate = 0.95;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }

  function playKannada(audioKey, fallbackText) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    const audio = new Audio(`../audio/${audioKey}.mp3`);
    currentAudio = audio;
    audio.play().catch(() => speakFallback(fallbackText));
  }

  function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function playTone(freq, dur = 0.16) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.stop(ctx.currentTime + dur);
    } catch (_) {}
  }

  function startGame() {
    deck = shuffle(ANIMALS);
    idx = 0;
    loadAnimal();
  }

  function playClue() {
    const a = deck[idx];
    playKannada(a.audio, `${a.soundKn}! ${a.kn}`);
  }

  function loadAnimal() {
    solved = false;
    const a = deck[idx];
    document.getElementById('progressText').textContent = `Animal ${idx + 1} of ${deck.length}`;
    document.getElementById('soundClue').textContent = `"${a.soundEn}" · ${a.kn}`;
    document.getElementById('phoneticClue').textContent = `Find: ${a.phonetic}`;
    document.getElementById('repeatPrompt').classList.remove('visible');
    document.getElementById('feedbackText').textContent = '';
    document.getElementById('nextBtn').style.display = 'none';

    const distractors = shuffle(ANIMALS.filter(x => x.kn !== a.kn)).slice(0, 3);
    const options = shuffle([a, ...distractors]);

    const grid = document.getElementById('safariGrid');
    grid.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'animal-card';
      btn.innerHTML = `<span class="emoji">${opt.emoji}</span><span class="sub">${opt.en}</span>`;
      btn.onclick = () => checkAnimal(btn, opt);
      grid.appendChild(btn);
    });

    playClue();
  }

  function checkAnimal(btn, opt) {
    if (solved) return;
    const a = deck[idx];
    if (opt.kn === a.kn) {
      solved = true;
      btn.classList.add('correct');
      score++;
      document.getElementById('score').textContent = score;
      document.getElementById('feedbackText').style.color = '#15803d';
      document.getElementById('feedbackText').textContent = `ಸರಿ! ${a.emoji} ${a.kn} (${a.phonetic})! 🎉`;
      document.getElementById('sayWordText').textContent = `"${a.kn} (${a.phonetic})"`;
      document.getElementById('repeatPrompt').classList.add('visible');
      document.getElementById('nextBtn').style.display = 'inline-block';
      playTone(587.33, 0.14);
      setTimeout(() => playTone(880, 0.24), 120);
      playKannada(a.audio, a.kn);
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      document.getElementById('feedbackText').style.color = '#b91c1c';
      document.getElementById('feedbackText').textContent = 'ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ (Try again!)';
      playTone(200, 0.22);
      playKannada('try_again', 'ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ');
    }
  }

  function nextAnimal() {
    idx++;
    if (idx < deck.length) {
      loadAnimal();
    } else {
      document.getElementById('gameCard').innerHTML = `
        <div style="font-size:4rem;margin-bottom:0.5rem;">🦁</div>
        <h2 style="font-size:1.8rem;color:#3f6212;margin-bottom:0.5rem;">ಅಭಿನಂದನೆಗಳು! Safari Complete!</h2>
        <p style="font-size:1.1rem;margin-bottom:1.5rem;">You spotted all ${deck.length} animals and earned <strong>${score} ⭐</strong>!</p>
        <button class="next-btn" style="display:inline-block;" onclick="location.reload()">ಮತ್ತೆ ಆಡಿ (Play Again)</button>
      `;
    }
  }

  startGame();
</script>
</body>
</html>
